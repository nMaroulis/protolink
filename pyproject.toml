[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "protolink"
version = "0.6.9"
description = "A lightweight Python runtime for local and distributed agent meshes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.12.4",
]
license = "MIT"
authors = [
    {name = "Nikolaos Maroulis", email = "nikolaos@maroulis.dev"},
]

[tool.setuptools.packages.find]
where = ["."]
include = ["protolink*"]

[tool.setuptools.package-data]
protolink = ["py.typed"]

# Type Checking - ty setup
[tool.ty.src]
include = ["protolink", "benchmarks"]
exclude = ["build", "tests"]

[tool.ty.rules]
# strong rule set
unresolved-reference = "error"
invalid-assignment = "error"
invalid-return-type = "error"
missing-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.analysis]
# These imports are behind optional extras. Keep core type checks independent of
# heavyweight provider SDKs while still using their types when locally installed.
allowed-unresolved-imports = [
    "anthropic.**",
    "google.genai.**",
    "grpc_health.**",
    "grpc_reflection.**",
    "huggingface_hub.**",
    "llama_cpp.**",
    "mcp.**",
    "openai.**",
    "pypdf.**",
    "qdrant_client.**",
]

[project.urls]
Documentation = "https://nmaroulis.github.io/protolink/"
Repository = "https://github.com/nMaroulis/protolink"

[project.scripts]
protolink = "protolink.cli:main"

[project.optional-dependencies]
http = [
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]

grpc = [
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "grpcio-reflection>=1.76.0",
]

llms = [
    "anthropic>=0.109.2",
    "huggingface-hub>=1.3.3",
    "google-genai>=1.60.0",
    "llama-cpp-python>=0.3.30",
    "openai>=2.43.0",
]

mcp = [
    "mcp>=1.28.0",
]

telemetry = [
    "langfuse",
    "langsmith",
]

metrics = [
    "tiktoken>=0.7.0",
]

rag-pdf = [
    "pypdf>=5.0.0",
]

# Database Drivers
db = [
]

# All optional dependencies
all = [
    "protolink[grpc]",
    "protolink[http]",
    "protolink[llms]",
    "protolink[mcp]",
    "protolink[db]",
    "protolink[telemetry]",
    "protolink[metrics]",
    "protolink[rag-pdf]",
]

# Only for testing
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.1",
    "ruff==0.14.5",
    "ty>=0.0.75",
    "pre-commit>=4.4.0",
    "protolink[grpc]", # For testing gRPC transport
    "protolink[http]", # For testing HTTP transport
]

# Jupyter Notebook dependencies
notebook = [
    "jupyter>=1.1.1",
    "notebook>=7.5.3",
]

# All dependencies for development
dev = [
    "protolink[all]",
    "protolink[test]",
    "protolink[notebook]",
]

# Documentation is built with Docusaurus from docs/package.json.
docs = []

# Build tools
build = [
    "build>=1.5.0",
    "twine>=6.2.0",
    "wheel>=0.45.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = "-v"
asyncio_default_test_loop_scope = "module"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.legacy.*:",
    "ignore::DeprecationWarning:uvicorn.protocols.websockets.websockets_impl.*:",
]

[tool.coverage.run]
source = ["protolink"]
omit = ["tests/*"]
