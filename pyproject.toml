[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "protolink"
version = "0.7.4"
description = "A lightweight Python runtime for local and distributed agent meshes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.4",
]
license = "MIT"
authors = [
    {name = "Nikolaos Maroulis", email = "nikolaos@maroulis.dev"},
]

[project.urls]
Documentation = "https://nmaroulis.github.io/protolink/"
Repository = "https://github.com/nMaroulis/protolink"
Issues = "https://github.com/nMaroulis/protolink/issues"
Changelog = "https://nmaroulis.github.io/protolink/docs/changelog/"

[project.scripts]
protolink = "protolink.cli:main"

[project.optional-dependencies]
integrations = ["httpx>=0.28.1"]
yaml = ["PyYAML>=6.0.2"]

documents = ["pypdf>=5.0.0", "python-docx>=1.2.0", "openpyxl>=3.1.0"]

http = [
    "fastapi>=0.137.2",
    "httpx>=0.28.1",
    "starlette>=1.3.1",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]

grpc = [
    "grpcio>=1.76.0",
    "grpcio-health-checking>=1.76.0",
    "grpcio-reflection>=1.76.0",
]

# Choose one provider without installing unrelated SDKs or local model bindings.
openai = ["openai>=2.43.0"]
anthropic = ["anthropic>=0.109.2"]
gemini = ["google-genai>=1.60.0"]
huggingface = ["huggingface-hub>=1.3.3"]
deepseek = ["openai>=2.43.0"]
grok = ["httpx>=0.28.1"]
ollama = ["httpx>=0.28.1"]
openai-compatible = ["httpx>=0.28.1"]
lmstudio = ["httpx>=0.28.1"]
vllm = ["httpx>=0.28.1"]
llama-cpp-server = ["httpx>=0.28.1"]
llama-cpp-local = ["llama-cpp-python>=0.3.30"]

# Existing all-provider bundle, including local llama.cpp bindings.
llms = [
    "protolink[openai,anthropic,gemini,huggingface,deepseek,grok,ollama]",
    "protolink[openai-compatible,lmstudio,vllm,llama-cpp-server,llama-cpp-local]",
]

mcp = [
    "mcp>=2.2.0",
    "httpx2>=2.5.0",
    "jsonschema>=4.20.0",
    "referencing>=0.28.4",
]

telemetry = [
    "langfuse>=4.0.0,<5",
    "langsmith",
]

metrics = [
    "tiktoken>=0.7.1",
]

rag-pdf = [
    "pypdf>=5.0.0",
]

# Retained for existing installation commands; no database driver is bundled.
db = []

# All optional dependencies
all = [
    "protolink[grpc]",
    "protolink[http]",
    "protolink[integrations]",
    "protolink[documents]",
    "protolink[llms]",
    "protolink[mcp]",
    "protolink[db]",
    "protolink[telemetry]",
    "protolink[metrics]",
    "protolink[rag-pdf]",
    "protolink[yaml]",
]

# Compatibility extras for existing pip workflows. Contributors use the groups below.
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.1",
    "ruff==0.16.7",
    "ty==0.0.80",
    "pre-commit>=4.4.0",
    "protolink[grpc]", # For testing gRPC transport
    "protolink[http]", # For testing HTTP transport
    "protolink[documents]", # For testing document extraction
    "protolink[yaml]",
]

# Jupyter Notebook dependencies
notebook = [
    "jupyter>=1.1.1",
    "notebook>=7.5.3",
]

# All dependencies for development
dev = [
    "protolink[all]",
    "protolink[test]",
    "protolink[notebook]",
]

# Documentation is built with Docusaurus from docs/package.json.
docs = []

# Build tools
build = [
    "build>=1.5.0",
    "twine>=6.2.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.1",
    "protolink[grpc,http,documents,mcp,yaml,telemetry]",
]
lint = ["ruff==0.16.7"]
typing = ["ty==0.0.80", "protolink[grpc,http,documents,mcp,yaml,telemetry]"]
build = ["protolink[build]"]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "typing"},
    "pre-commit>=4.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["protolink*"]

[tool.setuptools.package-data]
protolink = ["py.typed"]

[tool.ty.src]
include = ["protolink", "benchmarks"]
exclude = ["build", "tests"]

[tool.ty.rules]
unresolved-reference = "error"
invalid-assignment = "error"
invalid-return-type = "error"
missing-argument = "error"
possibly-unresolved-reference = "warn"

[tool.ty.analysis]
# These imports are behind optional extras. Keep core type checks independent of
# heavyweight provider SDKs while still using their types when locally installed.
allowed-unresolved-imports = [
    "anthropic.**",
    "google.genai.**",
    "grpc_health.**",
    "grpc_reflection.**",
    "huggingface_hub.**",
    "httpx2.**",
    "llama_cpp.**",
    "langfuse.**",
    "langsmith.**",
    "mcp.**",
    "jsonschema.**",
    "referencing.**",
    "openai.**",
    "pypdf.**",
    "docx.**",
    "openpyxl.**",
    "qdrant_client.**",
    "yaml.**",
]

[tool.pytest.ini_options]
required_plugins = ["pytest-asyncio>=1.4.0"]
testpaths = ["tests"]
pythonpath = ["."]
python_files = "test_*.py"
addopts = "-v"
asyncio_default_test_loop_scope = "module"
filterwarnings = [
    "ignore::DeprecationWarning:websockets.legacy.*:",
    "ignore::DeprecationWarning:uvicorn.protocols.websockets.websockets_impl.*:",
]

[tool.coverage.run]
source = ["protolink"]
omit = ["tests/*"]
