name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run Ruff
      run: |
        ruff check .
        ruff format --check .

  typecheck:
    name: ty
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run ty
      run: |
        ty check protolink

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

    - name: Run tests
      run: |
        pytest -v --cov=protolink --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[build]"

    - name: Build and check package
      run: |
        python -m build
        twine check dist/*

    - name: Verify the installed base wheel
      run: |
        python -m venv "$RUNNER_TEMP/protolink-wheel"
        "$RUNNER_TEMP/protolink-wheel/bin/python" -m pip install dist/*.whl
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/protolink-wheel/bin/python" -I - <<'PY'
        from importlib.metadata import version
        from importlib.resources import files

        from protolink import Agent, AgentCard, __version__, create_llm

        assert __version__ == version("protolink")
        assert files("protolink").joinpath("py.typed").is_file()
        agent = Agent(
            AgentCard(name="wheel-smoke", description="Installed wheel check", url="runtime://wheel-smoke"),
            llm=create_llm("mock", default_response="Installed successfully"),
        )
        assert agent.sync.invoke("Hello") == "Installed successfully"
        PY
        "$RUNNER_TEMP/protolink-wheel/bin/protolink" --version
