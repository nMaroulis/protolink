name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: '0.12.17'

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}

    - run: uv sync --locked --only-group lint

    - name: Run Ruff
      run: |
        uv run --no-sync ruff check .
        uv run --no-sync ruff format --check .

  typecheck:
    name: ty
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}

    - run: uv sync --locked --no-default-groups --group typing

    - name: Run ty
      run: |
        uv run --no-sync ty check protolink

  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}

    - run: uv sync --locked --no-default-groups --group test

    - name: Run tests
      run: |
        uv run --no-sync pytest --cov=protolink --cov-report=xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  dependency-compatibility:
    name: Dependencies (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: ['lowest-direct', 'highest']

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}
    - name: Resolve independently of the development lock
      run: |
        uv venv
        uv pip install --resolution "${{ matrix.resolution }}" -e ".[test,mcp,telemetry]"
    - name: Test supported dependency versions
      run: uv run --no-sync pytest

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install build tools
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: ${{ env.UV_VERSION }}

    - run: uv sync --locked --no-default-groups --group build

    - name: Build and check package
      run: |
        uv run --no-sync python -m build
        uv run --no-sync twine check --strict dist/*

    - name: Verify the minimum build backend
      run: |
        printf 'setuptools==77.0.3\n' > "$RUNNER_TEMP/build-constraints.txt"
        uv build --wheel --build-constraints "$RUNNER_TEMP/build-constraints.txt" --out-dir "$RUNNER_TEMP/min-build"

    - name: Verify the installed base wheel
      run: |
        python -m venv "$RUNNER_TEMP/protolink-wheel"
        "$RUNNER_TEMP/protolink-wheel/bin/python" -m pip install dist/*.whl
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/protolink-wheel/bin/python" -I - <<'PY'
        from importlib.metadata import version
        from importlib.resources import files

        from protolink import Agent, AgentCard, __version__, create_llm

        assert __version__ == version("protolink")
        assert files("protolink").joinpath("py.typed").is_file()
        agent = Agent(
            AgentCard(name="wheel-smoke", description="Installed wheel check", url="runtime://wheel-smoke"),
            llm=create_llm("mock", default_response="Installed successfully"),
        )
        assert agent.sync.invoke("Hello") == "Installed successfully"
        simple = Agent(name="simple-wheel", llm="mock")
        assert simple.card.url == "runtime://simple-wheel"
        assert simple.sync.invoke("Hello") == "Unprocessed generic mock response"
        try:
            simple.to_yaml_string()
        except ImportError as exc:
            assert 'protolink[yaml]' in str(exc)
        else:
            raise AssertionError("The base wheel unexpectedly includes YAML support")
        PY
        "$RUNNER_TEMP/protolink-wheel/bin/protolink" --version

    - name: Verify the installed YAML extra
      run: |
        for wheel in dist/*.whl; do
          "$RUNNER_TEMP/protolink-wheel/bin/python" -m pip install "${wheel}[yaml]"
        done
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/protolink-wheel/bin/python" -I - <<'PY'
        from protolink import Agent

        agent = Agent(name="yaml-wheel", llm="mock")
        restored = Agent.from_yaml_string(agent.to_yaml_string())
        assert restored.card.name == agent.card.name
        assert restored.sync.invoke("Hello") == "Unprocessed generic mock response"
        PY
